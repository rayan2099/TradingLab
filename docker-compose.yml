# Trading Lab - الملخص 9 candles & volume method, paper trading only.
# Every container runs scripts/safety_check.py first and refuses to start if it fails.
# One service per bot in user_data/config/bots/ (course strategies + the benchmark).
#
#   make docker-up        start the course bots + benchmark in dry-run
#   make docker-download  download BTC/ETH/SOL history (public data, no keys)
#   make docker-backtest  backtest the course strategies against the benchmark

x-freqtrade: &freqtrade
  image: freqtradeorg/freqtrade:2026.10
  restart: unless-stopped
  volumes:
    - ./user_data:/freqtrade/user_data
    - ./scripts:/freqtrade/scripts:ro
  entrypoint: ["/bin/sh", "-c"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-trade: &trade_cmd >-
  python /freqtrade/scripts/safety_check.py &&
  freqtrade trade
  --config /freqtrade/user_data/config/base.json
  --config /freqtrade/user_data/config/bots/$${BOT}.json
  --logfile /freqtrade/user_data/logs/$${BOT}.log

services:
  course_candle_volume:
    <<: *freqtrade
    environment: {BOT: course_candle_volume}
    command: [*trade_cmd]
  benchmark_buy_and_hold:
    <<: *freqtrade
    environment: {BOT: benchmark_buy_and_hold}
    command: [*trade_cmd]

  # One-off jobs: docker compose run --rm tools "<command>"
  tools:
    <<: *freqtrade
    restart: "no"
    profiles: ["tools"]
    command: ["python /freqtrade/scripts/safety_check.py"]
