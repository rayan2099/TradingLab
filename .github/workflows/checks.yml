name: checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Safety gate (stdlib only)
        run: python scripts/safety_check.py
      - name: Install pinned Freqtrade
        run: pip install -r requirements.txt
      - name: Offline test suite
        run: PYTHON=python bash tests/run_checks.sh
